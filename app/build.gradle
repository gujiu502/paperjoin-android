plugins {
    id 'com.android.application'
}

def signing = new Properties()
def signingFile = rootProject.file('.signing/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def signingValue = { env, key -> System.getenv(env) ?: signing.getProperty(key) }
def releaseKey = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def appVersion = providers.gradleProperty('versionName').getOrElse('1.0.2')
def parts = appVersion.tokenize('.').collect { it.toInteger() }

android {
    namespace 'com.paperjoin.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.paperjoin.app'
        minSdk 23
        targetSdk 35
        versionCode providers.gradleProperty('versionCode').getOrElse("${parts[0] * 1000000 + parts[1] * 1000 + parts[2]}").toInteger()
        versionName appVersion
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false

    signingConfigs {
        release {
            if (releaseKey) {
                storeFile rootProject.file(releaseKey)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES']
        resources.merges += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
    }
}

tasks.matching { it.name == 'validateSigningRelease' }.configureEach {
    doFirst {
        if (!releaseKey) throw new GradleException('Release signing is missing. Set ANDROID_KEYSTORE_* / ANDROID_KEY_* or .signing/signing.properties.')
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.core:core:1.12.0'
}
